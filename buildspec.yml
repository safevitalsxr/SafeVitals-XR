version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Running security check..."
      - npm audit --audit-level=high

  build:
    commands:
      - echo "Building SafeVitals application..."
      - npm run build

  post_build:
    commands:
      - echo "Build completed successfully."
      - date

artifacts:
  files:
    - '**/*'
  discard-paths: no
