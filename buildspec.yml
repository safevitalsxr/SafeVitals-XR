version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Running npm security audit..."
      - npm audit --audit-level=high || true
      - echo "Security audit completed. Continuing build..."

  build:
    commands:
      - echo "Building SafeVitals frontend..."
      - npm run build

  post_build:
    commands:
      - echo "SafeVitals frontend build completed successfully."
      - date

artifacts:
  files:
    - '**/*'
  discard-paths: no
