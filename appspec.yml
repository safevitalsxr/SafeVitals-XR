version: 0.0

os: linux

files:
  - source: /
    destination: /home/ubuntu/SafeVitals-XR

hooks:

  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/health.sh
      timeout: 300
      runas: root
