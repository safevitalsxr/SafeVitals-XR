version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/SafeVitals-XR

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/health.sh
      timeout: 60
      runas: root
